<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Management System - Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .tracking-number {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #667eea;
        }

        .info-text {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
        }

        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .step-hidden {
            display: none;
        }

        .code-hint {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .resend-link {
            text-align: center;
            margin-top: 10px;
        }

        .resend-link a {
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Queue Management System</h1>
        <p class="subtitle">Register to join the queue</p>

        <!-- Step 1: name + email, request verification code -->
        <form id="emailForm">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" name="userName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <button type="submit" class="btn" id="sendCodeBtn">Send Verification Code</button>
        </form>

        <!-- Step 2: enter the pincode emailed to the user -->
        <form id="codeForm" class="step-hidden">
            <div class="form-group">
                <label for="pinCode">Verification Code</label>
                <input type="text" id="pinCode" name="pinCode" required placeholder="6-digit code" inputmode="numeric" maxlength="6">
            </div>
            <p class="code-hint">We emailed you a code.</p>

            <button type="submit" class="btn" id="verifyCodeBtn">Verify &amp; Join Queue</button>
            <div class="resend-link"><a id="resendLink">Resend code</a></div>
        </form>

        <div id="result"></div>

        <div class="admin-link">
            <a href="/admin">Admin Dashboard</a>
        </div>
    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const codeForm = document.getElementById('codeForm');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const verifyCodeBtn = document.getElementById('verifyCodeBtn');
        const resendLink = document.getElementById('resendLink');
        const resultEl = document.getElementById('result');

        let pendingUserName = '';
        let pendingEmail = '';

        function showResult(className, html) {
            resultEl.className = className;
            resultEl.style.display = 'block';
            resultEl.innerHTML = html;
        }

        async function sendVerificationCode() {
            const userName = document.getElementById('userName').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!userName || !email) {
                return;
            }

            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/api/queue/send-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                if (response.ok) {
                    pendingUserName = userName;
                    pendingEmail = email;
                    emailForm.classList.add('step-hidden');
                    codeForm.classList.remove('step-hidden');
                    resultEl.style.display = 'none';
                } else {
                    showResult('error', '<p>Could not send verification code. Please try again.</p>');
                }
            } catch (error) {
                showResult('error', '<p>An error occurred. Please try again.</p>');
            } finally {
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = 'Send Verification Code';
            }
        }

        emailForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendVerificationCode();
        });

        resendLink.addEventListener('click', (e) => {
            e.preventDefault();
            sendVerificationCode();
        });

        codeForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const pincode = document.getElementById('pinCode').value.trim();
            verifyCodeBtn.disabled = true;
            verifyCodeBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/queue/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userName: pendingUserName, email: pendingEmail, pincode })
                });

                if (response.ok) {
                    const data = await response.json();
                    showResult('success', `
                        <h3>Registration Successful!</h3>
                        <div class="tracking-number">${data.trackingNumber}</div>
                        <p><strong>Queue Number:</strong> ${data.queueNumber}</p>
                        <p><strong>People Ahead:</strong> ${data.peopleAhead}</p>
                        <p class="info-text">📧 Check your email for a tracking link!</p>
                        <p class="info-text">You will receive notifications when it's your turn.</p>
                    `);
                    emailForm.reset();
                    codeForm.reset();
                    codeForm.classList.add('step-hidden');
                    emailForm.classList.remove('step-hidden');
                } else if (response.status === 401) {
                    showResult('error', '<p>Invalid or expired code. Please try again or resend the code.</p>');
                } else {
                    showResult('error', '<p>Registration failed. Please try again.</p>');
                }
            } catch (error) {
                showResult('error', '<p>An error occurred. Please try again.</p>');
            } finally {
                verifyCodeBtn.disabled = false;
                verifyCodeBtn.textContent = 'Verify & Join Queue';
            }
        });
    </script>
</body>
</html>
